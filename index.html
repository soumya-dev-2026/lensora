<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/icon.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lensora — Camera Studio</title>
    <style>
      #startup-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; margin: 0; background: #061421; opacity: 1; transition: opacity .3s ease; }
      #startup-splash picture { display: block; width: 100%; height: 100%; min-height: 0; }
      #startup-splash img { display: block; width: 100%; height: 100%; object-fit: contain; }
      #startup-splash.leaving { opacity: 0; }
      #startup-splash::after { content: ''; position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); width: 48px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #6fffea, #aa68ff); animation: splash-pulse 1s ease-in-out infinite alternate; }
      @keyframes splash-pulse { to { opacity: .35; transform: scaleX(.6); } }
      @media (prefers-reduced-motion: reduce) { #startup-splash { transition: none; } #startup-splash::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="Loading Lensora camera studio">
      <picture>
        <source media="(max-width: 767px)" srcset="/m_poster.jpeg" />
        <img src="/d_poster.jpeg" alt="Lensora. Record, enhance, create: your scene, reimagined." fetchpriority="high" />
      </picture>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
