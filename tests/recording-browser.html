<!doctype html><html lang="en"><meta charset="utf-8"><title>Recording smoke check</title>
<button id="run">Check MP4 recording</button><p id="result" role="status">Ready</p><canvas id="preview" width="640" height="360"></canvas><video id="playback" controls></video>
<script type="module">
import { WebGLCompositor } from '/src/rendering/WebGLCompositor.ts';
import { drawLiveText, DEFAULT_LIVE_TEXT } from '/src/rendering/liveText.ts';
import { getMp4MimeType } from '/src/recording/mp4.ts';
import { DEFAULT_FILTERS } from '/src/types/filters.ts';
import { DEFAULT_EFFECTS } from '/src/types/effects.ts';
const result = document.querySelector('#result');
document.querySelector('#run').onclick = async () => {
  let compositor, stream, audio, oscillator, timer, url;
  try {
    const canvas = document.querySelector('#preview'), output = canvas.getContext('2d');
    const source = document.createElement('canvas'); source.width = 320; source.height = 180;
    const input = source.getContext('2d'), scene = document.createElement('canvas'); scene.width = 320; scene.height = 180;
    compositor = new WebGLCompositor(scene);
    const filters = { ...DEFAULT_FILTERS, brightness: 5, superBeauty: 60 };
    const effects = { ...DEFAULT_EFFECTS, frame: 'film', grain: 5 };
    const mask = new Uint8Array([255]);
    let frame = 0;
    const draw = () => {
      input.fillStyle = '#286077'; input.fillRect(0, 0, 320, 180);
      input.fillStyle = '#edb881'; input.fillRect(40 + frame++ % 100, 40, 80, 100);
      compositor.render(source, mask, 1, 1, false, true, 0, 0, filters, undefined, null, effects, frame / 30);
      output.drawImage(scene, 0, 0, 640, 360);
      drawLiveText(output, { ...DEFAULT_LIVE_TEXT, enabled: true, text: 'Lensora recording check' }, 640, 360);
    };
    draw(); timer = setInterval(draw, 100);
    audio = new AudioContext(); await audio.resume();
    oscillator = audio.createOscillator(); const gain = audio.createGain(), destination = audio.createMediaStreamDestination();
    gain.gain.value = 0.02; oscillator.connect(gain).connect(destination); oscillator.start();
    stream = canvas.captureStream(30); stream.addTrack(destination.stream.getAudioTracks()[0]);
    const recorder = new MediaRecorder(stream, { mimeType: getMp4MimeType((type) => MediaRecorder.isTypeSupported(type), true) });
    const chunks = []; recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
    const finished = new Promise((resolve, reject) => { recorder.onstop = resolve; recorder.onerror = reject; });
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    result.textContent = 'Recording, pausing, resuming, and checking MP4…';
    recorder.start(); await wait(800); recorder.pause();
    if (recorder.state !== 'paused') throw new Error('Pause failed');
    gain.gain.value = 0; await wait(200); recorder.resume(); await wait(800);
    gain.gain.value = 0.02; recorder.stop(); await finished;
    const blob = new Blob(chunks, { type: recorder.mimeType });
    const header = new TextDecoder().decode(await blob.slice(0, 64).arrayBuffer());
    if (!blob.size || !header.includes('ftyp')) throw new Error('Invalid MP4 output');
    const playback = document.querySelector('#playback'); url = URL.createObjectURL(blob);
    const metadata = new Promise((resolve, reject) => { playback.onloadedmetadata = resolve; playback.onerror = reject; });
    playback.src = url; await metadata;
    if (playback.videoWidth !== 640 || playback.videoHeight !== 360) throw new Error('Recording resolution changed');
    result.textContent = `PASS: MP4 ${blob.size} bytes; 640 × 360 video decoded; pause/resume and audio mute completed; composed caption and effects captured.`;
  } catch (error) { result.textContent = `FAIL: ${error.message || error}`; }
  finally { clearInterval(timer); stream?.getTracks().forEach((track) => track.stop()); oscillator?.stop(); await audio?.close(); compositor?.dispose(); }
};
</script></html>
